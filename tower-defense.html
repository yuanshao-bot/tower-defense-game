<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>塔防守卫战</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #141a16; color: #e8eee6;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex; justify-content: center; padding: 16px; min-height: 100vh;
  }
  #wrap { width: 660px; max-width: 100%; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 6px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: 2px; }
  .stats { display: flex; gap: 14px; font-weight: 600; font-size: 14px; }
  .stat b { color: #ffd76a; }
  #hp { color: #ff6b6b; }
  #wave { color: #8fd4ff; }
  #toolbar { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .tower-btn {
    flex: 1; min-width: 118px; background: #1e2a20; border: 2px solid #2f4032;
    border-radius: 10px; padding: 8px 10px; cursor: pointer; color: inherit;
    text-align: left; font: inherit; font-size: 13px; transition: border-color .15s, background .15s;
  }
  .tower-btn:hover { border-color: #4a6350; }
  .tower-btn.active { border-color: #ffd76a; background: #2a3526; }
  .tower-btn .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .tower-btn .cost { float: right; color: #ffd76a; font-weight: 700; }
  .tower-btn .hotkey { color: #6b806c; font-size: 11px; }
  .tower-btn small { display: block; color: #9db09c; margin-top: 3px; font-size: 11px; }
  #stage { position: relative; }
  canvas { display: block; width: 100%; background: #000; border-radius: 10px; }
  #overlay {
    position: absolute; inset: 0; background: rgba(10,14,10,0.88); border-radius: 10px;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; padding: 24px; z-index: 10;
  }
  #overlay.hidden { display: none; }
  #overlay h2 { margin: 0 0 8px; font-size: 26px; }
  #overlay p { color: #b8c8b4; margin: 4px 0; font-size: 14px; }
  #overlay .big-btn { margin-top: 16px; padding: 10px 36px; font-size: 16px; }
  .btn {
    background: #3a7d44; color: #fff; border: none; border-radius: 8px;
    padding: 8px 16px; font: inherit; font-size: 13px; cursor: pointer; transition: background .15s;
  }
  .btn:hover { background: #4a9a56; }
  .btn:disabled { background: #2a3a2c; color: #6b806c; cursor: default; }
  .btn.danger { background: #a04444; }
  .btn.danger:hover { background: #c05555; }
  .btn.gold { background: #b8912e; }
  .btn.gold:hover { background: #d4a83a; }
  .btn.blue { background: #2d6da8; }
  .btn.blue:hover { background: #3a85c4; }
  #controls { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  #controls .btn { flex: 1; min-width: 100px; }
  #controls .btn.narrow { flex: 0.5; min-width: 80px; }
  #info { margin-top: 8px; background: #1e2a20; border: 1px solid #2f4032; border-radius: 10px; padding: 10px 12px; display: none; font-size: 13px; }
  #info .info-actions { margin-top: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #help { margin-top: 10px; color: #7a8f78; font-size: 12px; line-height: 1.6; }
  kbd { background: #2a3a2c; border-radius: 4px; padding: 1px 5px; font-size: 11px; color: #c8d8c4; }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <h1>🏰 塔防守卫战</h1>
    <div class="stats">
      <span class="stat" id="hp">❤️ 20/20</span>
      <span class="stat">💰 <b id="money">150</b></span>
      <span class="stat" id="wave">🌊 第 0 波</span>
    </div>
  </header>
  <div id="toolbar"></div>
  <div id="stage">
    <canvas id="game" width="640" height="480"></canvas>
    <div id="overlay">
      <h2>🏰 塔防守卫战</h2>
      <p>敌人将沿道路进攻你的基地，点击空地建造炮台防守。</p>
      <p>击杀敌人获得金币 · 敌人抵达基地会扣血 · 血量归零则失败</p>
      <p style="margin-top:12px;color:#8fa88c;font-size:13px">
        <kbd>1-5</kbd> 选择炮台 · <kbd>空格</kbd> 暂停 · <kbd>N</kbd> 提前下一波 · <kbd>Esc</kbd>/右键 取消
      </p>
      <button class="btn big-btn" id="startBtn">开始游戏</button>
    </div>
  </div>
  <div id="controls">
    <button class="btn" id="waveBtn">⚔️ 开始第 1 波</button>
    <button class="btn blue" id="autoBtn">🔄 自动: 关</button>
    <button class="btn narrow" id="speedBtn">速度 x1</button>
    <button class="btn narrow" id="muteBtn">🔊 音效</button>
  </div>
  <div id="info"></div>
  <div id="help">
    💡 点击已建造炮台可切换索敌优先级、升级（3级）或出售。金矿塔定期产金币。飞行敌人沿直线快速通过。Boss半血召唤小怪！
  </div>
</div>

<script>
'use strict';
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const COLS = 16, ROWS = 12, CELL = 40;
const WAYPOINTS = [
  [-1, 6], [4, 6], [4, 2], [9, 2], [9, 9], [13, 9], [13, 4], [16.5, 4]
].map(function(p) { return { x: p[0] * CELL + CELL / 2, y: p[1] * CELL + CELL / 2 }; });
const FLY_PATH = [{ x: -30, y: 100 }, { x: 670, y: 100 }];
const PATH_CELLS = new Set();
for (let i = 0; i < WAYPOINTS.length - 1; i++) {
  const a = WAYPOINTS[i], b = WAYPOINTS[i + 1];
  const steps = Math.ceil(Math.hypot(b.x - a.x, b.y - a.y) / CELL) + 1;
  for (let s = 0; s <= steps; s++) {
    const x = a.x + (b.x - a.x) * s / steps;
    const y = a.y + (b.y - a.y) * s / steps;
    const c = Math.floor(x / CELL), r = Math.floor(y / CELL);
    if (c >= 0 && c < COLS && r >= 0 && r < ROWS) PATH_CELLS.add(c + ',' + r);
  }
}
const TOWER_TYPES = {
  gun: { name: '机枪塔', cost: 50, range: 100, cd: 0.4, dmg: 9, color: '#9aa5b1', barrel: '#57616e', kind: 'bullet', upCost: 45, desc: '射速快，单体伤害' },
  cannon: { name: '火炮塔', cost: 120, range: 130, cd: 1.3, dmg: 34, splash: 55, color: '#c0563e', barrel: '#7c2f1e', kind: 'shell', upCost: 110, desc: '范围爆炸伤害' },
  frost: { name: '冰霜塔', cost: 80, range: 110, cd: 0.9, dmg: 5, slow: 0.5, slowT: 1.8, color: '#59c3e3', barrel: '#2b7a94', kind: 'pulse', upCost: 70, desc: '减速周围敌人' },
  sniper: { name: '狙击塔', cost: 200, range: 230, cd: 1.9, dmg: 85, color: '#7fae5a', barrel: '#43672c', kind: 'beam', upCost: 160, desc: '远程高伤，瞬间命中' },
  mine: { name: '金矿塔', cost: 100, range: 0, cd: 3.0, dmg: 0, color: '#ffd76a', barrel: '#b8912e', kind: 'mine', upCost: 80, desc: '定期产出金币 (+5/3s)' }
};
const TARGET_MODES = ['first', 'last', 'strong', 'weak'];
const TARGET_LABELS = { first: '最前', last: '最后', strong: '最强', weak: '最弱' };
const ENEMY_TYPES = {
  normal: { hp: 32, speed: 62, reward: 8, leak: 1, r: 11, color: '#e05252', flying: false },
  fast: { hp: 18, speed: 115, reward: 10, leak: 1, r: 9, color: '#e8a33d', flying: false },
  tank: { hp: 130, speed: 34, reward: 26, leak: 2, r: 15, color: '#8e6cc0', flying: false },
  boss: { hp: 650, speed: 26, reward: 130, leak: 5, r: 19, color: '#d13b3b', flying: false, boss: true },
  bat: { hp: 14, speed: 140, reward: 12, leak: 1, r: 8, color: '#b06ad4', flying: true }
};
const state = {
  running: false, paused: false, over: false,
  hp: 20, maxHp: 20, money: 150, wave: 0, kills: 0, totalDmg: 0,
  enemies: [], towers: [], bullets: [], effects: [],
  spawnQueue: [], spawnTimer: 0,
  waveActive: false, betweenTimer: 0,
  selectedType: null, selectedTower: null,
  speed: 1, muted: false, autoWave: false,
  time: 0, flash: 0, shake: 0, shakeX: 0, shakeY: 0,
  mx: -100, my: -100
};
let audioCtx = null;
function beep(freq, dur, type, vol) {
  if (state.muted) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || 'square';
    o.frequency.value = freq;
    g.gain.value = vol || 0.03;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}
function towerStats(t) {
  const d = TOWER_TYPES[t.type], l = t.level;
  return {
    dmg: d.dmg * Math.pow(1.5, l - 1),
    range: d.range > 0 ? d.range * (1 + 0.12 * (l - 1)) : 0,
    cd: d.cd * Math.pow(0.88, l - 1),
    splash: d.splash ? d.splash * (1 + 0.1 * (l - 1)) : 0,
    slow: d.slow || 0, slowT: d.slowT || 0,
    mineRate: t.type === 'mine' ? Math.round(5 * Math.pow(1.5, l - 1)) : 0
  };
}
function upCost(t) { const d = TOWER_TYPES[t.type]; return Math.round(d.upCost * (1 + 0.7 * (t.level - 1))); }
function sellValue(t) { return Math.floor(t.invested * 0.6); }
function buildWave(n) {
  const q = []; const hpMul = 1 + (n - 1) * 0.15;
  const push = function(t, c) { for (let i = 0; i < c; i++) q.push({ type: t, hpMul: hpMul }); };
  push('normal', 6 + Math.floor(n * 1.5));
  if (n >= 2) push('fast', Math.floor(n * 1.1));
  if (n >= 3) push('tank', Math.max(1, Math.floor((n - 2) / 2)));
  if (n >= 4) push('bat', Math.floor(n * 0.8));
  if (n % 5 === 0) push('boss', Math.floor(n / 5));
  return q;
}
function spawnEnemy(item) {
  const d = ENEMY_TYPES[item.type];
  if (d.flying) {
    state.enemies.push({ type: item.type, x: FLY_PATH[0].x, y: FLY_PATH[0].y, wp: 1, dist: 0, flying: true, hp: d.hp * item.hpMul, maxHp: d.hp * item.hpMul, speed: d.speed, slow: 0, slowT: 0, reward: d.reward, leak: d.leak, r: d.r, color: d.color, dead: false });
  } else {
    state.enemies.push({ type: item.type, x: WAYPOINTS[0].x, y: WAYPOINTS[0].y, wp: 1, dist: 0, flying: false, hp: d.hp * item.hpMul, maxHp: d.hp * item.hpMul, speed: d.speed, slow: 0, slowT: 0, reward: d.reward, leak: d.leak, r: d.r, color: d.color, dead: false, minionSpawned: false });
  }
}
function shake(amount) { state.shake = Math.min(10, state.shake + amount); }
function findNearestWaypoint(x, y) {
  let best = 0, bestD = Infinity;
  for (let i = 0; i < WAYPOINTS.length; i++) {
    const d = Math.hypot(WAYPOINTS[i].x - x, WAYPOINTS[i].y - y);
    if (d < bestD) { bestD = d; best = i; }
  }
  return Math.max(1, best);
}
function bossSummon(boss) {
  for (let i = 0; i < 2; i++) {
    const d = ENEMY_TYPES.normal;
    const hpMul = 1 + (state.wave - 1) * 0.1;
    state.enemies.push({ type: 'normal', x: boss.x - 10 + i * 20, y: boss.y, wp: findNearestWaypoint(boss.x, boss.y), dist: boss.dist * 0.9, flying: false, hp: d.hp * hpMul * 0.5, maxHp: d.hp * hpMul * 0.5, speed: d.speed, slow: 0, slowT: 0, reward: 4, leak: 1, r: d.r, color: d.color, dead: false, minionSpawned: true });
  }
  state.effects.push({ type: 'text', x: boss.x, y: boss.y - 25, txt: '召唤小怪!', life: 1.0, max: 1.0, color: '#d13b3b' });
  beep(200, 0.2, 'sawtooth', 0.04);
}
function damageEnemy(e, dmg) {
  if (e.dead) return;
  e.hp -= dmg;
  state.totalDmg += dmg;
  state.effects.push({ type: 'dmg', x: e.x + (Math.random() - 0.5) * 12, y: e.y - e.r - 4, txt: String(Math.round(dmg)), life: 0.6, max: 0.6, color: dmg >= 50 ? '#ff6b4a' : '#ffe08a' });
  if (e.hp <= 0) {
    e.dead = true; state.money += e.reward; state.kills++;
    state.effects.push({ type: 'boom', x: e.x, y: e.y, r: e.r + 8, life: 0.25, max: 0.25 });
    state.effects.push({ type: 'text', x: e.x, y: e.y - e.r - 14, txt: '+' + e.reward, life: 0.7, max: 0.7, color: '#ffd76a' });
    shake(2);
  }
}
function startWave(early) {
  if (state.waveActive || state.over || !state.running) return;
  if (early && state.wave > 0) {
    const bonus = Math.max(0, Math.ceil(state.betweenTimer)) * 2;
    state.money += bonus;
    state.effects.push({ type: 'text', x: 320, y: 200, txt: '提前开战 +' + bonus, life: 1.0, max: 1.0, color: '#ffd76a' });
  }
  state.wave++;
  state.spawnQueue = buildWave(state.wave);
  state.spawnTimer = 0.5;
  state.waveActive = true; state.betweenTimer = 0;
  state.effects.push({ type: 'wave', txt: '第 ' + state.wave + ' 波', life: 1.6, max: 1.6 });
  beep(440, 0.15, 'triangle', 0.05);
  setTimeout(function() { beep(560, 0.2, 'triangle', 0.05); }, 150);
}
function gameOver() {
  state.over = true; state.hp = 0;
  beep(120, 0.5, 'sawtooth', 0.06);
  let best = 0;
  try {
    best = parseInt(localStorage.getItem('td_best') || '0', 10) || 0;
    if (state.wave > best) { best = state.wave; localStorage.setItem('td_best', String(best)); }
  } catch (e) { best = state.wave; }
  const overlay = document.getElementById('overlay');
  overlay.classList.remove('hidden');
  overlay.innerHTML = '<h2>💀 防线失守！</h2><p>你坚守了 <b style="color:#8fd4ff">第 ' + state.wave + ' 波</b> 的进攻</p><p>击杀 <b style="color:#ffd76a">' + state.kills + '</b> · 总伤害 <b style="color:#ff6b4a">' + Math.round(state.totalDmg) + '</b> · 最高纪录 第 ' + best + ' 波</p><button class="btn big-btn" id="restartBtn">重新开始</button>';
  document.getElementById('restartBtn').onclick = restart;
}
function restart() {
  state.running = true; state.paused = false; state.over = false;
  state.hp = 20; state.money = 150; state.wave = 0; state.kills = 0; state.totalDmg = 0;
  state.enemies = []; state.towers = []; state.bullets = []; state.effects = [];
  state.spawnQueue = []; state.waveActive = false; state.betweenTimer = 0;
  state.selectedType = null; state.selectedTower = null;
  state.speed = 1; state.flash = 0; state.shake = 0;
  document.getElementById('speedBtn').textContent = '速度 x1';
  document.getElementById('overlay').classList.add('hidden');
  updateToolbar(); updateInfo();
}
function update(dt) {
  state.time += dt;
  if (state.flash > 0) state.flash -= dt;
  if (state.shake > 0) {
    state.shake -= dt * 20;
    if (state.shake < 0) state.shake = 0;
    state.shakeX = (Math.random() - 0.5) * state.shake * 2;
    state.shakeY = (Math.random() - 0.5) * state.shake * 2;
  } else { state.shakeX = 0; state.shakeY = 0; }
  if (state.spawnQueue.length > 0) {
    state.spawnTimer -= dt;
    if (state.spawnTimer <= 0) { spawnEnemy(state.spawnQueue.shift()); state.spawnTimer = 0.85; }
  }
  for (const e of state.enemies) {
    if (e.dead) continue;
    e.slowT -= dt;
    if (e.type === 'boss' && !e.minionSpawned && e.hp < e.maxHp * 0.5) { e.minionSpawned = true; bossSummon(e); }
    const slowFactor = e.slowT > 0 ? 1 - e.slow : 1;
    const sp = e.speed * slowFactor;
    if (e.flying) {
      const target = FLY_PATH[e.wp];
      const dx = target.x - e.x, dy = target.y - e.y;
      const d = Math.hypot(dx, dy);
      if (d <= sp * dt + 0.01) {
        e.dead = true; state.hp -= e.leak; state.flash = 0.3; shake(5);
        beep(140, 0.3, 'square', 0.05);
        if (state.hp <= 0) { gameOver(); return; }
      } else { e.x += dx / d * sp * dt; e.y += dy / d * sp * dt; e.dist += sp * dt; }
    } else {
      const wp = WAYPOINTS[e.wp];
      const dx = wp.x - e.x, dy = wp.y - e.y;
      const d = Math.hypot(dx, dy);
      if (d <= sp * dt + 0.01) {
        e.x = wp.x; e.y = wp.y; e.dist += d; e.wp++;
        if (e.wp >= WAYPOINTS.length) {
          e.dead = true; state.hp -= e.leak; state.flash = 0.3; shake(5);
          beep(140, 0.3, 'square', 0.05);
          if (state.hp <= 0) { gameOver(); return; }
        }
      } else { e.x += dx / d * sp * dt; e.y += dy / d * sp * dt; e.dist += sp * dt; }
    }
  }
  state.enemies = state.enemies.filter(function(e) { return !e.dead; });
  for (const t of state.towers) {
    const s = towerStats(t);
    t.cdLeft -= dt;
    if (t.type === 'mine') {
      if (t.cdLeft <= 0) {
        t.cdLeft = s.cd;
        state.money += s.mineRate;
        state.effects.push({ type: 'text', x: t.x, y: t.y - 18, txt: '+' + s.mineRate, life: 0.8, max: 0.8, color: '#ffd76a' });
        beep(800, 0.06, 'sine', 0.02);
      }
      continue;
    }
    if (t.cdLeft > 0) continue;
    let target = null;
    for (const e of state.enemies) {
      if (e.dead) continue;
      if (Math.hypot(e.x - t.x, e.y - t.y) <= s.range + e.r) {
        if (!target) { target = e; continue; }
        if (t.targetMode === 'last') { if (e.dist < target.dist) target = e; }
        else if (t.targetMode === 'strong') { if (e.hp > target.hp) target = e; }
        else if (t.targetMode === 'weak') { if (e.hp < target.hp) target = e; }
        else { if (e.dist > target.dist) target = e; }
      }
    }
    if (!target) continue;
    t.angle = Math.atan2(target.y - t.y, target.x - t.x);
    t.cdLeft = s.cd;
    if (t.type === 'gun') {
      state.bullets.push({ x: t.x, y: t.y, target: target, speed: 480, dmg: s.dmg, kind: 'bullet' });
      beep(700, 0.04, 'square', 0.015);
    } else if (t.type === 'cannon') {
      state.bullets.push({ x: t.x, y: t.y, tx: target.x, ty: target.y, speed: 260, dmg: s.dmg, splash: s.splash, kind: 'shell' });
      beep(160, 0.12, 'sawtooth', 0.03); shake(1);
    } else if (t.type === 'frost') {
      state.effects.push({ type: 'pulse', x: t.x, y: t.y, r: s.range, life: 0.35, max: 0.35 });
      for (const e of state.enemies) {
        if (e.dead) continue;
        if (Math.hypot(e.x - t.x, e.y - t.y) <= s.range + e.r) {
          damageEnemy(e, s.dmg);
          if (!e.dead) { e.slow = Math.max(e.slow, s.slow); e.slowT = Math.max(e.slowT, s.slowT); }
        }
      }
      beep(880, 0.08, 'sine', 0.02);
    } else if (t.type === 'sniper') {
      state.effects.push({ type: 'beam', x1: t.x, y1: t.y, x2: target.x, y2: target.y, life: 0.12, max: 0.12 });
      damageEnemy(target, s.dmg);
      beep(1100, 0.06, 'square', 0.02);
    }
  }
  for (const b of state.bullets) {
    if (b.kind === 'shell') {
      const dx = b.tx - b.x, dy = b.ty - b.y;
      const d = Math.hypot(dx, dy);
      if (d <= b.speed * dt + 1) {
        b.done = true;
        state.effects.push({ type: 'boom', x: b.tx, y: b.ty, r: b.splash, life: 0.35, max: 0.35 });
        shake(3);
        for (const e of state.enemies) {
          if (!e.dead && Math.hypot(e.x - b.tx, e.y - b.ty) <= b.splash + e.r) damageEnemy(e, b.dmg);
        }
        beep(90, 0.2, 'sawtooth', 0.04);
      } else { b.x += dx / d * b.speed * dt; b.y += dy / d * b.speed * dt; }
    } else {
      if (b.target.dead) { b.done = true; continue; }
      const dx = b.target.x - b.x, dy = b.target.y - b.y;
      const d = Math.hypot(dx, dy);
      if (d <= b.speed * dt + b.target.r) { b.done = true; damageEnemy(b.target, b.dmg); }
      else { b.x += dx / d * b.speed * dt; b.y += dy / d * b.speed * dt; }
    }
  }
  state.bullets = state.bullets.filter(function(b) { return !b.done; });
  for (const f of state.effects) f.life -= dt;
  state.effects = state.effects.filter(function(f) { return f.life > 0; });
  if (state.waveActive && state.spawnQueue.length === 0 && state.enemies.length === 0) {
    state.waveActive = false; state.betweenTimer = 10;
    const bonus = 25 + state.wave * 3;
    state.money += bonus;
    state.effects.push({ type: 'text', x: 320, y: 180, txt: '波次奖励 +' + bonus, life: 1.2, max: 1.2, color: '#8fd4ff' });
    beep(660, 0.1, 'triangle', 0.04);
    setTimeout(function() { beep(880, 0.15, 'triangle', 0.04); }, 100);
  }
  if (!state.waveActive && state.wave > 0) {
    state.betweenTimer -= dt;
    if (state.betweenTimer <= 0) startWave(false);
  }
}
function draw() {
  ctx.save();
  ctx.translate(state.shakeX, state.shakeY);
  ctx.fillStyle = '#2e4a2e';
  ctx.fillRect(-10, -10, canvas.width + 20, canvas.height + 20);
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if ((r + c) % 2 === 0) { ctx.fillStyle = 'rgba(0,0,0,0.06)'; ctx.fillRect(c * CELL, r * CELL, CELL, CELL); }
    }
  }
  ctx.fillStyle = '#8a7a5a';
  PATH_CELLS.forEach(function(key) {
    const p = key.split(','); const c = +p[0], r = +p[1];
    ctx.fillRect(c * CELL, r * CELL, CELL, CELL);
  });
  ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.lineWidth = 2;
  PATH_CELLS.forEach(function(key) {
    const p = key.split(','); const c = +p[0], r = +p[1];
    ctx.strokeRect(c * CELL + 1, r * CELL + 1, CELL - 2, CELL - 2);
  });
  ctx.strokeStyle = '#c9b98a'; ctx.lineWidth = 4; ctx.setLineDash([12, 10]);
  ctx.beginPath(); ctx.moveTo(WAYPOINTS[0].x, WAYPOINTS[0].y);
  for (let i = 1; i < WAYPOINTS.length; i++) ctx.lineTo(WAYPOINTS[i].x, WAYPOINTS[i].y);
  ctx.stroke(); ctx.setLineDash([]);
  ctx.strokeStyle = 'rgba(176,106,212,0.2)'; ctx.lineWidth = 3; ctx.setLineDash([8, 8]);
  ctx.beginPath(); ctx.moveTo(FLY_PATH[0].x, FLY_PATH[0].y); ctx.lineTo(FLY_PATH[1].x, FLY_PATH[1].y);
  ctx.stroke(); ctx.setLineDash([]);
  const base = WAYPOINTS[WAYPOINTS.length - 1];
  ctx.fillStyle = '#3a6ea5'; ctx.beginPath(); ctx.arc(base.x - 25, base.y, 16, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('🏠', base.x - 25, base.y + 1);
  const sel = state.selectedTower;
  if (sel) {
    const s = towerStats(sel);
    if (s.range > 0) {
      ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.beginPath(); ctx.arc(sel.x, sel.y, s.range, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1.5; ctx.stroke();
    }
  }
  for (const t of state.towers) {
    const d = TOWER_TYPES[t.type];
    if (t.type === 'mine') {
      ctx.fillStyle = d.color; ctx.beginPath(); ctx.arc(t.x, t.y, 13, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#8a6d1e'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('💰', t.x, t.y + 1);
    } else {
      ctx.save(); ctx.translate(t.x, t.y); ctx.rotate(t.angle);
      ctx.fillStyle = d.barrel; ctx.fillRect(0, -4, 20, 8);
      ctx.restore();
      ctx.fillStyle = d.color; ctx.beginPath(); ctx.arc(t.x, t.y, 13, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 2; ctx.stroke();
    }
    for (let i = 0; i < t.level; i++) {
      ctx.fillStyle = '#ffd76a'; ctx.beginPath(); ctx.arc(t.x - 8 + i * 8, t.y - 19, 2.5, 0, Math.PI * 2); ctx.fill();
    }
  }
  for (const e of state.enemies) {
    if (e.type === 'boss') {
      ctx.strokeStyle = 'rgba(255,100,100,0.5)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 4, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.fillStyle = e.color; ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1.5; ctx.stroke();
    if (e.flying) {
      ctx.strokeStyle = 'rgba(176,106,212,0.6)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(e.x - e.r - 6, e.y); ctx.lineTo(e.x - e.r + 2, e.y - 8); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(e.x + e.r + 6, e.y); ctx.lineTo(e.x + e.r - 2, e.y - 8); ctx.stroke();
    }
    if (e.slowT > 0) {
      ctx.strokeStyle = 'rgba(120,220,255,0.9)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 3, 0, Math.PI * 2); ctx.stroke();
    }
    const pct = Math.max(0, e.hp / e.maxHp); const bw = e.r * 2;
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(e.x - bw / 2, e.y - e.r - 9, bw, 4);
    ctx.fillStyle = pct > 0.5 ? '#5bc85b' : (pct > 0.25 ? '#e8c93d' : '#e05252');
    ctx.fillRect(e.x - bw / 2, e.y - e.r - 9, bw * pct, 4);
  }
  for (const b of state.bullets) {
    if (b.kind === 'shell') {
      ctx.fillStyle = '#3b3b3b'; ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,150,50,0.4)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - (b.tx - b.x) * 0.1, b.y - (b.ty - b.y) * 0.1); ctx.stroke();
    } else {
      ctx.fillStyle = '#ffd76a'; ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, Math.PI * 2); ctx.fill();
    }
  }
  for (const f of state.effects) {
    const p = f.life / f.max;
    if (f.type === 'boom') {
      ctx.fillStyle = 'rgba(255,150,50,' + (p * 0.6).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (1 - p * 0.4), 0, Math.PI * 2); ctx.fill();
    } else if (f.type === 'pulse') {
      ctx.strokeStyle = 'rgba(100,210,255,' + (p * 0.7).toFixed(3) + ')'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (1 - p), 0, Math.PI * 2); ctx.stroke();
    } else if (f.type === 'beam') {
      ctx.strokeStyle = 'rgba(255,255,255,' + p.toFixed(3) + ')'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(f.x1, f.y1); ctx.lineTo(f.x2, f.y2); ctx.stroke();
    } else if (f.type === 'dmg') {
      ctx.fillStyle = f.color; ctx.globalAlpha = p;
      ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(f.txt, f.x, f.y - (1 - p) * 18); ctx.globalAlpha = 1;
    } else if (f.type === 'text') {
      ctx.fillStyle = f.color || '#ffd76a'; ctx.globalAlpha = p;
      ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(f.txt, f.x, f.y - (1 - p) * 25); ctx.globalAlpha = 1;
    } else if (f.type === 'wave') {
      ctx.fillStyle = 'rgba(143,212,255,' + Math.min(1, p * 2).toFixed(3) + ')';
      ctx.font = 'bold 34px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(f.txt, 320, 120 - (1 - p) * 15);
    }
  }
  if (state.selectedType && state.running && !state.over) {
    const c = Math.floor(state.mx / CELL), r = Math.floor(state.my / CELL);
    if (c >= 0 && c < COLS && r >= 0 && r < ROWS) {
      const key = c + ',' + r;
      const occupied = state.towers.some(function(t) { return t.c === c && t.r === r; });
      const valid = !PATH_CELLS.has(key) && !occupied;
      const def = TOWER_TYPES[state.selectedType];
      const afford = state.money >= def.cost;
      const x = c * CELL + CELL / 2, y = r * CELL + CELL / 2;
      if (def.range > 0) {
        ctx.fillStyle = valid && afford ? 'rgba(90,220,90,0.07)' : 'rgba(220,80,80,0.07)';
        ctx.strokeStyle = valid && afford ? 'rgba(90,220,90,0.4)' : 'rgba(220,80,80,0.4)';
        ctx.beginPath(); ctx.arc(x, y, def.range, 0, Math.PI * 2); ctx.fill();
        ctx.lineWidth = 1.5; ctx.stroke();
      }
      ctx.fillStyle = valid && afford ? 'rgba(90,220,90,0.4)' : 'rgba(220,80,80,0.4)';
      ctx.beginPath(); ctx.arc(x, y, 13, 0, Math.PI * 2); ctx.fill();
    }
  }
  if (state.flash > 0) {
    ctx.fillStyle = 'rgba(255,50,50,' + (state.flash * 1.2).toFixed(3) + ')';
    ctx.fillRect(-10, -10, canvas.width + 20, canvas.height + 20);
  }
  ctx.restore();
  if (state.paused && state.running && !state.over) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 28px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('⏸ 已暂停', 320, 230);
    ctx.font = '14px sans-serif'; ctx.fillStyle = '#b8c8b4'; ctx.fillText('按空格键继续', 320, 262);
  }
}
function updateHud() {
  document.getElementById('hp').textContent = '❤️ ' + Math.max(0, state.hp) + '/' + state.maxHp;
  document.getElementById('money').textContent = state.money;
  document.getElementById('wave').textContent = '🌊 第 ' + state.wave + ' 波';
  const btn = document.getElementById('waveBtn');
  if (!state.running) { btn.textContent = '⚔️ 开始第 1 波'; btn.disabled = true; }
  else if (state.waveActive) { btn.textContent = '⚔️ 进攻中…'; btn.disabled = true; }
  else if (state.wave === 0) { btn.textContent = '⚔️ 开始第 1 波'; btn.disabled = false; }
  else { btn.textContent = '⚔️ 下一波 (' + Math.max(0, Math.ceil(state.betweenTimer)) + 's)'; btn.disabled = false; }
}
function updateToolbar() {
  const bar = document.getElementById('toolbar');
  bar.innerHTML = '';
  const keys = Object.keys(TOWER_TYPES);
  keys.forEach(function(key, i) {
    const d = TOWER_TYPES[key];
    const btn = document.createElement('button');
    btn.className = 'tower-btn' + (state.selectedType === key ? ' active' : '');
    btn.innerHTML = '<span class="swatch" style="background:' + d.color + '"></span>' + d.name +
      ' <span class="cost">💰' + d.cost + '</span> <span class="hotkey">[' + (i + 1) + ']</span><small>' + d.desc + '</small>';
    btn.onclick = function() {
      state.selectedType = state.selectedType === key ? null : key;
      state.selectedTower = null; updateInfo(); updateToolbar();
    };
    bar.appendChild(btn);
  });
}
function updateInfo() {
  const el = document.getElementById('info');
  const t = state.selectedTower;
  if (!t) { el.style.display = 'none'; return; }
  const d = TOWER_TYPES[t.type];
  const s = towerStats(t);
  el.style.display = 'block';
  let html = '<b style="color:' + d.color + '">' + d.name + ' Lv.' + t.level + '</b>';
  if (t.type === 'mine') {
    html += ' — 每次产出 ' + s.mineRate + ' 金币 · 间隔 ' + s.cd.toFixed(1) + 's';
  } else {
    html += ' — 伤害 ' + Math.round(s.dmg) + ' · 射程 ' + Math.round(s.range) + ' · 攻速 ' + (1 / s.cd).toFixed(2) + '/s' +
      (s.splash ? ' · 爆炸半径 ' + Math.round(s.splash) : '') + (s.slow ? ' · 减速 ' + Math.round(s.slow * 100) + '%' : '');
  }
  html += '<div class="info-actions">';
  if (t.type !== 'mine') {
    html += '<button class="btn blue" id="targetBtn">🎯 优先: ' + TARGET_LABELS[t.targetMode || 'first'] + '</button>';
  }
  if (t.level < 3) html += '<button class="btn gold" id="upBtn">⬆ 升级 (💰' + upCost(t) + ')</button>';
  else html += '<span style="color:#9db09c">已满级</span>';
  html += '<button class="btn danger" id="sellBtn">💰 出售 (+' + sellValue(t) + ')</button></div>';
  el.innerHTML = html;
  const targetBtn = document.getElementById('targetBtn');
  if (targetBtn) targetBtn.onclick = function() {
    const modeIdx = TARGET_MODES.indexOf(t.targetMode || 'first');
    t.targetMode = TARGET_MODES[(modeIdx + 1) % TARGET_MODES.length];
    updateInfo();
  };
  const up = document.getElementById('upBtn');
  if (up) up.onclick = upgradeTower;
  document.getElementById('sellBtn').onclick = sellTower;
}
function upgradeTower() {
  const t = state.selectedTower;
  if (!t || t.level >= 3) return;
  const cost = upCost(t);
  if (state.money < cost) return;
  state.money -= cost; t.level++; t.invested += cost;
  beep(520, 0.08, 'triangle', 0.04);
  setTimeout(function() { beep(660, 0.1, 'triangle', 0.04); }, 80);
  updateInfo();
}
function sellTower() {
  const t = state.selectedTower;
  if (!t) return;
  state.money += sellValue(t);
  state.towers = state.towers.filter(function(x) { return x !== t; });
  state.selectedTower = null;
  beep(300, 0.08, 'triangle', 0.03);
  updateInfo();
}
function canvasPos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * canvas.width / r.width, y: (e.clientY - r.top) * canvas.height / r.height };
}
canvas.addEventListener('mousemove', function(e) {
  const p = canvasPos(e); state.mx = p.x; state.my = p.y;
});
canvas.addEventListener('click', function(e) {
  if (!state.running || state.over) return;
  const p = canvasPos(e);
  const c = Math.floor(p.x / CELL), r = Math.floor(p.y / CELL);
  if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return;
  const existing = state.towers.find(function(t) { return t.c === c && t.r === r; });
  if (existing) { state.selectedTower = existing; updateInfo(); return; }
  state.selectedTower = null; updateInfo();
  if (!state.selectedType) return;
  const key = c + ',' + r;
  if (PATH_CELLS.has(key)) return;
  const def = TOWER_TYPES[state.selectedType];
  if (state.money < def.cost) {
    state.effects.push({ type: 'text', x: p.x, y: p.y - 10, txt: '金币不足', life: 0.9, max: 0.9, color: '#ff6b6b' });
    return;
  }
  state.money -= def.cost;
  state.towers.push({ type: state.selectedType, c: c, r: r, x: c * CELL + CELL / 2, y: r * CELL + CELL / 2, level: 1, cdLeft: 0, angle: 0, invested: def.cost, targetMode: 'first' });
  beep(520, 0.06, 'triangle', 0.03);
});
canvas.addEventListener('contextmenu', function(e) {
  e.preventDefault();
  state.selectedType = null; state.selectedTower = null;
  updateInfo(); updateToolbar();
});
window.addEventListener('keydown', function(e) {
  const keys = Object.keys(TOWER_TYPES);
  if (e.key >= '1' && e.key <= '5') {
    const key = keys[parseInt(e.key, 10) - 1];
    if (key) {
      state.selectedType = state.selectedType === key ? null : key;
      state.selectedTower = null; updateInfo(); updateToolbar();
    }
  } else if (e.key === 'Escape') {
    state.selectedType = null; state.selectedTower = null;
    updateInfo(); updateToolbar();
  } else if (e.code === 'Space') {
    e.preventDefault();
    if (state.running && !state.over) state.paused = !state.paused;
  } else if (e.code === 'KeyN') {
    if (state.running && !state.over && !state.waveActive) startWave(true);
  }
});
document.getElementById('waveBtn').onclick = function() { startWave(true); };
document.getElementById('autoBtn').onclick = function() {
  state.autoWave = !state.autoWave;
  this.textContent = state.autoWave ? '🔄 自动: 开' : '🔄 自动: 关';
};
document.getElementById('speedBtn').onclick = function() {
  state.speed = state.speed === 1 ? 2 : 1;
  this.textContent = '速度 x' + state.speed;
};
document.getElementById('muteBtn').onclick = function() {
  state.muted = !state.muted;
  this.textContent = state.muted ? '🔇 静音' : '🔊 音效';
};
document.getElementById('startBtn').onclick = function() {
  state.running = true;
  document.getElementById('overlay').classList.add('hidden');
};
updateToolbar();
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (state.running && !state.paused && !state.over) { update(dt * state.speed); }
  draw(); updateHud();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
