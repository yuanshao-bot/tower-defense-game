<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#1e2a20">
<title>塔防守卫战</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#141a16;color:#e8eee6;font-family:"Segoe UI",system-ui,sans-serif;display:flex;justify-content:center;padding:16px;min-height:100vh}
#wrap{width:700px;max-width:100%}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:6px}
h1{font-size:20px;letter-spacing:2px}
.stats{display:flex;gap:14px;font-weight:600;font-size:14px}
.stat b{color:#ffd76a}
#hp{color:#ff6b6b}
#wave{color:#8fd4ff}
#toolbar{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.tower-btn{flex:1;min-width:78px;background:#1e2a20;border:2px solid #2f4032;border-radius:10px;padding:6px 8px;cursor:pointer;color:inherit;text-align:center;font:inherit;font-size:12px;transition:border-color .15s}
.tower-btn:hover{border-color:#4a6350}
.tower-btn.active{border-color:#ffd76a;background:#2a3526}
.tower-btn .sw{display:block;width:16px;height:16px;border-radius:50%;margin:0 auto 4px}
.tower-btn .cost{color:#ffd76a;font-weight:700;font-size:11px}
.tower-btn .hk{color:#5a6f5c;font-size:10px}
#stage{position:relative}
canvas{display:block;width:100%;background:#000;border-radius:10px}
#overlay{position:absolute;inset:0;background:rgba(10,14,10,0.92);border-radius:10px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;z-index:10}
#overlay.hidden{display:none}
#overlay h2{font-size:26px;margin-bottom:8px}
#overlay p{color:#b8c8b4;margin:4px 0;font-size:14px}
#overlay .big{margin-top:16px;padding:10px 36px;font-size:16px}
#diffBox{display:flex;gap:8px;margin:14px 0}
.diff-btn{background:#1e2a20;border:2px solid #2f4032;border-radius:10px;padding:10px 18px;cursor:pointer;color:inherit;font:inherit;font-size:14px;transition:border-color .15s}
.diff-btn:hover{border-color:#4a6350}
.diff-btn.active{border-color:#ffd76a;background:#2a3526}
.diff-btn small{display:block;color:#9db09c;font-size:11px;margin-top:2px}
.btn{background:#3a7d44;color:#fff;border:none;border-radius:8px;padding:8px 14px;font:inherit;font-size:12px;cursor:pointer;transition:background .15s}
.btn:hover{background:#4a9a56}
.btn:disabled{background:#2a3a2c;color:#6b806c;cursor:default}
.btn.danger{background:#a04444}.btn.danger:hover{background:#c05555}
.btn.gold{background:#b8912e}.btn.gold:hover{background:#d4a83a}
.btn.blue{background:#2d6da8}.btn.blue:hover{background:#3a85c4}
.btn.red{background:#c0392b}.btn.red:hover{background:#e74c3c}
#controls{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
#controls .btn{flex:1;min-width:80px}
#controls .btn.n{flex:0.5;min-width:70px}
#info{margin-top:8px;background:#1e2a20;border:1px solid #2f4032;border-radius:10px;padding:10px 12px;display:none;font-size:13px}
#info .acts{margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#help{margin-top:10px;color:#7a8f78;font-size:12px;line-height:1.6}
kbd{background:#2a3a2c;border-radius:4px;padding:1px 5px;font-size:11px;color:#c8d8c4}
</style>
</head>
<body>
<div id="wrap">
<header><h1>🏰 塔防守卫战</h1>
<div class="stats"><span class="stat" id="hp">❤️ 20/20</span><span class="stat">💰 <b id="money">150</b></span><span class="stat" id="wave">🌊 第 0 波</span></div></header>
<div id="toolbar"></div>
<div id="stage">
<canvas id="game" width="640" height="480"></canvas>
<div id="overlay">
<h2>🏰 塔防守卫战</h2>
<p>敌人会攻击你的炮台！炮台有血量和护甲，可分别升级攻击和防御。</p>
<div id="diffBox">
<button class="diff-btn active" data-d="easy">😊 简单<small>💰300 ❤️30 敌人弱</small></button>
<button class="diff-btn" data-d="normal">😐 普通<small>💰150 ❤️20 平衡</small></button>
<button class="diff-btn" data-d="hard">😨 困难<small>💰100 ❤️15 敌人强</small></button>
<button class="diff-btn" data-d="hell">💀 地狱<small>💰80 ❤️10 敌人凶</small></button>
</div>
<button class="btn big" id="startBtn">开始游戏</button>
</div>
</div>
<div id="controls">
<button class="btn" id="waveBtn">⚔️ 开始第 1 波</button>
<button class="btn blue n" id="speedBtn">⏩ x1</button>
<button class="btn n" id="fsBtn">⛶ 全屏</button>
<button class="btn n" id="muteBtn">🔊</button>
</div>
<div id="info"></div>
<div id="help">💡 敌人会攻击范围内的炮台！炮台血量归零会被摧毁。点击炮台可分别升级<b style="color:#ff6b4a">攻击</b>（伤害/射程/攻速）和<b style="color:#59c3e3">防御</b>（血量/护甲），还可花费金币修理。难度影响初始资源与敌人强度。</div>
</div>
<script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const COLS=16,ROWS=12,CELL=40;
const WAYPOINTS=[[-1,6],[4,6],[4,2],[9,2],[9,9],[13,9],[13,4],[16.5,4]].map(p=>({x:p[0]*CELL+CELL/2,y:p[1]*CELL+CELL/2}));
const FLY_PATH=[{x:-30,y:100},{x:670,y:100}];
const PATH_CELLS=new Set();
for(let i=0;i<WAYPOINTS.length-1;i++){const a=WAYPOINTS[i],b=WAYPOINTS[i+1];const steps=Math.ceil(Math.hypot(b.x-a.x,b.y-a.y)/CELL)+1;for(let s=0;s<=steps;s++){const x=a.x+(b.x-a.x)*s/steps,y=a.y+(b.y-a.y)*s/steps;const c=Math.floor(x/CELL),r=Math.floor(y/CELL);if(c>=0&&c<COLS&&r>=0&&r<ROWS)PATH_CELLS.add(c+','+r);}}
const TOWER_TYPES={
gun:{name:'机枪塔',cost:50,range:100,cd:0.4,dmg:9,hp:80,color:'#9aa5b1',barrel:'#57616e',kind:'bullet',upCost:45,desc:'快速单体'},
cannon:{name:'火炮塔',cost:120,range:130,cd:1.3,dmg:34,splash:55,hp:120,color:'#c0563e',barrel:'#7c2f1e',kind:'shell',upCost:110,desc:'范围爆炸'},
frost:{name:'冰霜塔',cost:80,range:110,cd:0.9,dmg:5,slow:0.5,slowT:1.8,hp:80,color:'#59c3e3',barrel:'#2b7a94',kind:'pulse',upCost:70,desc:'减速'},
sniper:{name:'狙击塔',cost:200,range:230,cd:1.9,dmg:85,hp:100,color:'#7fae5a',barrel:'#43672c',kind:'beam',upCost:160,desc:'远程高伤'},
mine:{name:'金矿塔',cost:100,range:0,cd:3,dmg:0,hp:60,color:'#ffd76a',barrel:'#b8912e',kind:'mine',upCost:80,desc:'产金币'},
poison:{name:'毒液塔',cost:90,range:100,cd:1,dmg:6,poisonDmg:4,poisonDur:3,hp:80,color:'#6ab04c',barrel:'#3a7d23',kind:'poison',upCost:80,desc:'毒素持续'},
tesla:{name:'电击塔',cost:150,range:120,cd:0.8,dmg:18,chain:3,hp:80,color:'#f5e663',barrel:'#c4a000',kind:'chain',upCost:120,desc:'连锁闪电'},
missile:{name:'导弹塔',cost:250,range:200,cd:2.5,dmg:120,splash:40,hp:120,color:'#666',barrel:'#333',kind:'missile',upCost:200,desc:'追踪高伤'}
};
const TARGET_MODES=['first','last','strong','weak'];
const TARGET_LABELS={first:'最前',last:'最后',strong:'最强',weak:'最弱'};
const ENEMY_TYPES={
normal:{hp:30,speed:62,reward:8,leak:1,r:11,color:'#e05252',flying:false,atk:8,atkCd:1.2},
fast:{hp:16,speed:115,reward:10,leak:1,r:9,color:'#e8a33d',flying:false,atk:5,atkCd:0.8},
tank:{hp:120,speed:34,reward:26,leak:2,r:15,color:'#8e6cc0',flying:false,atk:20,atkCd:1.5},
boss:{hp:600,speed:26,reward:130,leak:5,r:19,color:'#d13b3b',flying:false,boss:true,atk:40,atkCd:1.5},
bat:{hp:13,speed:140,reward:12,leak:1,r:8,color:'#b06ad4',flying:true,atk:4,atkCd:1}
};
const DIFFICULTIES={
easy:{name:'简单',money:300,hp:30,ehpMul:0.8,eatkMul:0.7,rewMul:1.2},
normal:{name:'普通',money:150,hp:20,ehpMul:1,eatkMul:1,rewMul:1},
hard:{name:'困难',money:100,hp:15,ehpMul:1.3,eatkMul:1.4,rewMul:0.9},
hell:{name:'地狱',money:80,hp:10,ehpMul:1.8,eatkMul:2,rewMul:0.8}
};
const SPEEDS=[1,2,3,5,10];
const state={running:false,paused:false,over:false,diff:'normal',hp:20,maxHp:20,money:150,wave:0,kills:0,totalDmg:0,towersLost:0,enemies:[],towers:[],bullets:[],effects:[],spawnQueue:[],spawnTimer:0,waveActive:false,betweenTimer:0,selectedType:null,selectedTower:null,speedIdx:0,muted:false,autoWave:true,time:0,flash:0,shake:0,shakeX:0,shakeY:0,mx:-100,my:-100};
let audioCtx=null;
function beep(f,d,t,v){if(state.muted)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t||'square';o.frequency.value=f;g.gain.value=v||0.03;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+d);o.stop(audioCtx.currentTime+d);}catch(e){}}
function towerStats(t){const d=TOWER_TYPES[t.type],a=t.atkLv,df=t.defLv;return{dmg:d.dmg*Math.pow(1.5,a-1),range:d.range>0?d.range*(1+0.12*(a-1)):0,cd:d.cd*Math.pow(0.88,a-1),splash:d.splash?d.splash*(1+0.1*(a-1)):0,slow:d.slow||0,slowT:d.slowT||0,chain:d.chain?d.chain+(a-1):0,poisonDmg:d.poisonDmg?d.poisonDmg*Math.pow(1.5,a-1):0,poisonDur:d.poisonDur||0,mineRate:t.type==='mine'?Math.round(5*Math.pow(1.5,a-1)):0,maxHp:Math.round(d.hp*Math.pow(1.4,df-1)),armor:(df-1)*8};}
function atkUpCost(t){return Math.round(TOWER_TYPES[t.type].upCost*(1+0.7*(t.atkLv-1)));}
function defUpCost(t){return Math.round(TOWER_TYPES[t.type].upCost*0.7*(1+0.6*(t.defLv-1)));}
function sellValue(t){return Math.floor(t.invested*0.6);}
function repairCost(t){const s=towerStats(t);return Math.ceil((s.maxHp-t.hp)*0.3);}
function buildWave(n){const q=[],m=1+(n-1)*0.10;const push=(t,c)=>{for(let i=0;i<c;i++)q.push({type:t,hpMul:m});};push('normal',6+Math.floor(n*1.5));if(n>=2)push('fast',Math.floor(n*1.1));if(n>=3)push('tank',Math.max(1,Math.floor((n-2)/2)));if(n>=4)push('bat',Math.floor(n*0.8));if(n%5===0)push('boss',Math.floor(n/5));return q;}
function spawnEnemy(it){const d=ENEMY_TYPES[it.type],dif=DIFFICULTIES[state.diff];const hp=d.hp*it.hpMul*dif.ehpMul;if(d.flying){state.enemies.push({type:it.type,x:FLY_PATH[0].x,y:FLY_PATH[0].y,wp:1,dist:0,flying:true,hp,maxHp:hp,speed:d.speed,slow:0,slowT:0,reward:Math.round(d.reward*dif.rewMul),leak:d.leak,r:d.r,color:d.color,dead:false,poison:null,atk:d.atk,atkCdMax:d.atkCd,atkCd:0});}else{state.enemies.push({type:it.type,x:WAYPOINTS[0].x,y:WAYPOINTS[0].y,wp:1,dist:0,flying:false,hp,maxHp:hp,speed:d.speed,slow:0,slowT:0,reward:Math.round(d.reward*dif.rewMul),leak:d.leak,r:d.r,color:d.color,dead:false,minionSpawned:false,poison:null,atk:d.atk,atkCdMax:d.atkCd,atkCd:0});}}
function shake(a){state.shake=Math.min(10,state.shake+a);}
function findNearestWp(x,y){let b=0,bd=1/0;for(let i=0;i<WAYPOINTS.length;i++){const d=Math.hypot(WAYPOINTS[i].x-x,WAYPOINTS[i].y-y);if(d<bd){bd=d;b=i;}}return Math.max(1,b);}
function bossSummon(b){for(let i=0;i<2;i++){const d=ENEMY_TYPES.normal,m=1+(state.wave-1)*0.1;state.enemies.push({type:'normal',x:b.x-10+i*20,y:b.y,wp:findNearestWp(b.x,b.y),dist:b.dist*0.9,flying:false,hp:d.hp*m*0.5,maxHp:d.hp*m*0.5,speed:d.speed,slow:0,slowT:0,reward:4,leak:1,r:d.r,color:d.color,dead:false,minionSpawned:true,poison:null,atk:d.atk,atkCdMax:d.atkCd,atkCd:0});}state.effects.push({type:'text',x:b.x,y:b.y-25,txt:'召唤小怪!',life:1,max:1,color:'#d13b3b'});beep(200,0.2,'sawtooth',0.04);}
function damageEnemy(e,dmg){if(e.dead)return;e.hp-=dmg;state.totalDmg+=dmg;state.effects.push({type:'dmg',x:e.x+(Math.random()-0.5)*12,y:e.y-e.r-4,txt:String(Math.round(dmg)),life:0.6,max:0.6,color:dmg>=50?'#ff6b4a':'#ffe08a'});if(e.hp<=0){e.dead=true;state.money+=e.reward;state.kills++;state.effects.push({type:'boom',x:e.x,y:e.y,r:e.r+8,life:0.25,max:0.25});state.effects.push({type:'text',x:e.x,y:e.y-e.r-14,txt:'+'+e.reward,life:0.7,max:0.7,color:'#ffd76a'});shake(2);}}
function applyPoison(e,dmg,dur){if(e.dead)return;if(!e.poison||e.poison.dmg<dmg){e.poison={dmg:dmg,time:dur,tick:0};}}
function damageTower(t,dmg,srcX,srcY){if(t.hp<=0)return;const s=towerStats(t);const real=Math.max(1,Math.round(dmg-s.armor));t.hp-=real;if(srcX!==undefined)state.effects.push({type:'dmg',x:t.x+(Math.random()-0.5)*12,y:t.y-20,txt:String(real),life:0.5,max:0.5,color:'#ff8a8a'});if(t.hp<=0){t.hp=0;destroyTower(t);}}
function destroyTower(t){state.towers=state.towers.filter(x=>x!==t);state.towersLost++;state.effects.push({type:'boom',x:t.x,y:t.y,r:30,life:0.4,max:0.4});state.effects.push({type:'text',x:t.x,y:t.y-20,txt:'炮台被摧毁!',life:1,max:1,color:'#ff4a4a'});shake(4);beep(80,0.3,'sawtooth',0.05);if(state.selectedTower===t){state.selectedTower=null;updateInfo();}}
function startWave(early){if(state.waveActive||state.over||!state.running)return;if(early&&state.wave>0){const b=Math.max(0,Math.ceil(state.betweenTimer))*2;state.money+=b;state.effects.push({type:'text',x:320,y:200,txt:'提前开战 +'+b,life:1,max:1,color:'#ffd76a'});}state.wave++;state.spawnQueue=buildWave(state.wave);state.spawnTimer=0.5;state.waveActive=true;state.betweenTimer=0;state.effects.push({type:'wave',txt:'第 '+state.wave+' 波',life:1.6,max:1.6});beep(440,0.15,'triangle',0.05);setTimeout(()=>beep(560,0.2,'triangle',0.05),150);}
function gameOver(){state.over=true;state.hp=0;beep(120,0.5,'sawtooth',0.06);const dif=DIFFICULTIES[state.diff];let best=0;try{const key='td_best_'+state.diff;best=parseInt(localStorage.getItem(key)||'0',10)||0;if(state.wave>best){best=state.wave;localStorage.setItem(key,String(best));}}catch(e){best=state.wave;}const ov=document.getElementById('overlay');ov.classList.remove('hidden');ov.innerHTML='<h2>💀 防线失守！</h2><p>'+dif.name+'难度 · 坚守了 <b style="color:#8fd4ff">第 '+state.wave+' 波</b></p><p>击杀 <b style="color:#ffd76a">'+state.kills+'</b> · 总伤害 <b style="color:#ff6b4a">'+Math.round(state.totalDmg)+'</b> · 炮台损失 <b style="color:#ff8a8a">'+state.towersLost+'</b></p><p style="color:#8fa88c;font-size:12px">最高纪录 第'+best+'波</p><button class="btn big" id="restartBtn">重新开始</button>';document.getElementById('restartBtn').onclick=showStart;}
function showStart(){state.running=false;state.over=false;state.paused=false;state.hp=DIFFICULTIES[state.diff].hp;state.maxHp=DIFFICULTIES[state.diff].hp;state.money=DIFFICULTIES[state.diff].money;state.wave=0;state.kills=0;state.totalDmg=0;state.towersLost=0;state.enemies=[];state.towers=[];state.bullets=[];state.effects=[];state.spawnQueue=[];state.waveActive=false;state.betweenTimer=0;state.selectedType=null;state.selectedTower=null;state.speedIdx=0;state.flash=0;state.shake=0;document.getElementById('speedBtn').textContent='⏩ x1';const ov=document.getElementById('overlay');ov.classList.remove('hidden');ov.innerHTML='<h2>🏰 塔防守卫战</h2><p>敌人会攻击你的炮台！炮台有血量和护甲，可分别升级攻击和防御。</p><div id="diffBox"><button class="diff-btn" data-d="easy">😊 简单<small>💰300 ❤️30 敌人弱</small></button><button class="diff-btn" data-d="normal">😐 普通<small>💰150 ❤️20 平衡</small></button><button class="diff-btn" data-d="hard">😨 困难<small>💰100 ❤️15 敌人强</small></button><button class="diff-btn" data-d="hell">💀 地狱<small>💰80 ❤️10 敌人凶</small></button></div><button class="btn big" id="startBtn">开始游戏</button>';bindStartUI();}
function bindStartUI(){
document.querySelectorAll('.diff-btn').forEach(b=>{b.onclick=function(){document.querySelectorAll('.diff-btn').forEach(x=>x.classList.remove('active'));this.classList.add('active');state.diff=this.getAttribute('data-d');};});
const sb=document.getElementById('startBtn');if(sb)sb.onclick=function(){const dif=DIFFICULTIES[state.diff];state.running=true;state.over=false;state.paused=false;state.hp=dif.hp;state.maxHp=dif.hp;state.money=dif.money;state.wave=0;state.kills=0;state.totalDmg=0;state.towersLost=0;state.enemies=[];state.towers=[];state.bullets=[];state.effects=[];state.spawnQueue=[];state.waveActive=false;state.betweenTimer=0;state.selectedType=null;state.selectedTower=null;state.speedIdx=0;state.flash=0;state.shake=0;document.getElementById('speedBtn').textContent='⏩ x1';document.getElementById('overlay').classList.add('hidden');updateToolbar();updateInfo();};}
function update(dt){
state.time+=dt;
if(state.flash>0)state.flash-=dt;
if(state.shake>0){state.shake-=dt*20;if(state.shake<0)state.shake=0;state.shakeX=(Math.random()-0.5)*state.shake*2;state.shakeY=(Math.random()-0.5)*state.shake*2;}else{state.shakeX=0;state.shakeY=0;}
if(state.spawnQueue.length>0){state.spawnTimer-=dt;if(state.spawnTimer<=0){spawnEnemy(state.spawnQueue.shift());state.spawnTimer=0.85;}}
for(const e of state.enemies){
if(e.dead)continue;
e.slowT-=dt;
if(e.type==='boss'&&!e.minionSpawned&&e.hp<e.maxHp*0.5){e.minionSpawned=true;bossSummon(e);}
if(e.poison&&e.poison.time>0){e.poison.time-=dt;e.poison.tick-=dt;if(e.poison.tick<=0){e.poison.tick=0.5;damageEnemy(e,e.poison.dmg*0.5);if(e.dead)continue;}}
const sf=e.slowT>0?1-e.slow:1;const sp=e.speed*sf;
let attacking=false;
if(!e.flying){
const atkRange=e.r+32;
let tgt=null,td=1/0;
for(const t of state.towers){const d=Math.hypot(e.x-t.x,e.y-t.y);if(d<=atkRange+13&&d<td){td=d;tgt=t;}}
if(tgt){
attacking=true;
e.atkCd-=dt;
if(e.atkCd<=0){e.atkCd=e.atkCdMax;const dif=DIFFICULTIES[state.diff];damageTower(tgt,e.atk*dif.eatkMul,e.x,e.y);state.effects.push({type:'slash',x1:e.x,y1:e.y,x2:tgt.x,y2:tgt.y,life:0.15,max:0.15});beep(250,0.06,'square',0.02);}
}}
if(!attacking){
if(e.flying){

else{

state.bullets=state.bullets.filter(b=>!b.done);
